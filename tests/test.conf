
server {

	listen 8080;
	listen 8081;

	root www;

	client_max_body_size 2m;

	access_log logs/access.log;
	error_log  logs/error.log;

	error_page_dir www/errors/HTML;
	timeout 1;
	
	mime_type .html text/html;
	mime_type .css  text/css;
	mime_type .js   application/javascript;
	mime_type .png  image/png;
	mime_type .jpg  image/jpeg;

	# setting default index (static)
	location / {
		methods GET;
		client_max_body_size 5m;
		index index.html;
		autoindex false;
	}
	
	location /test {
		methods GET;
		index index.html;
		autoindex false;
	}
	location /errors {
			methods GET;
	}

	# autoidx
	location /list {
		methods GET;
		autoindex true;
	}
	# to test METHODS on main server
	location /uploads {
		client_max_body_size 1m;
		methods POST DELETE GET;
	}

	# test config CGI
	location /cgi-bin {
		methods GET POST;
		cgi_ext .py  /usr/bin/python3;
		cgi_ext .php /usr/bin/php-cgi;
	}
}
