
# Future version: incude more servers

# MAIN SERVER (subject) : multiple locations

server {
	listen 127.0.0.1:8080; #WEB
	listen 8081; #LAN

	server_name a;

	root www;

	client_max_body_size 2m;

	error_log  logs/error.log;

	error_page_dir www/errors/HTML;
	timeout 5;
	
	mime_type .html text/html;
	mime_type .css  text/css;
	mime_type .js   application/javascript;
	mime_type .png  image/png;
	mime_type .jpg  image/jpeg;

	# setting default index (static)
	location / {
		methods GET POST;
		client_max_body_size 5m;
		index index.html;
		autoindex false;
	}
	
	location /redirect-me {
		return 301 /index.html;
	}

	location /test {
		methods GET;
		index index.html;
		autoindex false;
	}

	location /errors {
			methods GET;
	}

	location /some_directory {

		autoidx on;

	}
	# autoidx
	location /list {
		methods GET;
		autoindex true;
	}
	# to test METHODS on main server
	location /uploads {
		client_max_body_size 1m;
		methods POST DELETE GET;
		autoindex on;
	}

	# Redirection test
	location /search {
		return 301 http://www.google.com;
	}

	location /new-about {
		return 307 /redirection.html;
	}

	# test Moved Permanently redirection
	location /redir-301 {
		return 301 www.google.com;
	}

	# test Found redirection
	location /redir-302 {
		return 302 /about.html;
	}

	# test See Other redirection
	location /redir-303 {
		return 303 /index.html;
	}

	# test Temporary Redirect
	location /redir-307 {
		return 307 /index.html;
	}

	# test Permanent Redirect
	location /redir-308 {
		return 308 /index.html;
	}

	# test Big files upload
	location /upload-big {
		client_max_body_size 10m;
		methods POST DELETE GET;
	}

	# test config CGI
	location /cgi-bin {
		methods GET POST;
		cgi_ext .py  /usr/bin/python3;
		cgi_ext .php /usr/bin/php-cgi;
		cgi_ext .pl /usr/bin/perl;
		cgi_ext .sh /bin/bash;
	}
}

# Multiserver

# SERVER 1: basic GET server
server {
	listen 9080;
	server_name example.com;
	root ./www/site1;
	error_page_dir www/global_errors;
	client_max_body_size 1m;
	error_log  logs/error1.log;
	timeout 1;

	location / {
		methods GET;
		index index.html;
		autoindex false;
	}

	location /cgi-bin {
		methods GET POST;
		cgi_ext .py  /usr/bin/python3;
		cgi_ext .php /usr/bin/php-cgi;
		cgi_ext .sh /bin/bash;
	}
}

# SERVER 2: multiport + POST upload
server {
	listen 9090;
	listen 9092;
	root ./www/site2;
	client_max_body_size 5m;
	timeout 60;

	location / {
		methods GET;
		index index.html;
	}

	location /upload {
		methods POST;
	}

	location /cgi-bin {
		methods GET POST;
		cgi_ext .py  /usr/bin/python3;
		cgi_ext .php /usr/bin/php-cgi;
		cgi_ext .sh /bin/bash;
	}
}

# SERVER 3: DELETE + autoindex
server {
	listen 7080;
	root ./www/site3;
	client_max_body_size 512k;
	timeout 30;

	location / {
		methods GET;
		autoindex true;
	}

	location /delete {
		methods DELETE;
	}

	location /cgi-bin {
		methods GET POST;
		cgi_ext .py  /usr/bin/python3;
		cgi_ext .php /usr/bin/php-cgi;
	}

}

# SERVER 4: multiple locations for full routing test
server {
	listen 6080;
	root ./www;
	client_max_body_size 2m;
	error_log  logs/error.log;
	error_page 404 www/errors/HTML/404.html;
	error_page 500 www/errors/HTML/500.html;

	# default
	location / {
		methods GET;
		index index.html;
		autoindex false;
	}

	# directory listing
	location /files {
		methods GET;
		autoindex true;
	}

	# static assets
	location /assets {
		methods GET;
		root www/about.html;
	}

	# upload
	location /uploads {
		methods POST;
	}

	# delete
	location /delete {
		methods DELETE;
	}

	#redirection
	location /old-path {
		return 307 /;
	}

	location /gugou {
		return 301 http://www.google.com;
	}

	# GET + POST
	location /api {
		methods GET POST;
		index api.html;
	}

	location /cgi-bin {
		methods GET POST;
		cgi_ext .py  /usr/bin/python3;
		cgi_ext .php /usr/bin/php-cgi;
		cgi_ext .sh /bin/bash;
	}	
}